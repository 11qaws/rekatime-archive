  :root {
    color-scheme: dark;
    --bg: #0E0F11;
    --surface: #16181B;
    --surface-2: #1D2024;
    --line: #282C31;
    --line-soft: #1F2327;
    --text: #E9EDF1;
    /* 작은 글자가 많은 화면이라 보조·희미 단계도 6.5:1 을 넘긴다.
       (surface-2 #1D2024 기준 dim 9.98 · faint 6.96 · mark 7.62)
       세 단계 구분은 밝기 차 대신 크기·굵기로 낸다. */
    --dim: #C3CBD4;
    --faint: #A1AAB5;
    /* 치지직의 상징색. 이 사이트가 치지직 다시보기를 다루므로 강조색을 그대로 쓴다. */
    --accent: #00FFA3;
    --mark: #19C98F;

    /* ── 유레카 개인색 ──────────────────────────────
       출처: premiere-aftereffect 의 AE 디자인 스터디에 personalYellow/personalGreen 으로
       명시된 값이다(방송 제목마다 붙는 🍋과도 맞는다).

       **쓰는 자리를 좁게 묶어 둔다.** 노랑(60도)은 장르색 KOREAN/한국어(39.4도)와
       20.6도 떨어져 있지만 여전히 같은 노랑 계열이라, 데이터 근처에 두면 장르로 읽힌다.
       그래서 장르·비율·달력처럼 색이 뜻을 갖는 자리에는 절대 쓰지 않고,
       **누구의 아카이브인가**를 말하는 자리에만 쓴다 — 이름표, 배경의 기운, 재생 단추. */
    --eureka-yellow: #FFFF66;
    --eureka-green:  #73C794;
    --eureka-deep:   #1F6B45;   /* 글자에는 못 쓴다(대비 2.97) — 채움 전용 */
    /* 색·사진 위에 얹는 글자 — 본문 토큰이 통하지 않는 자리의 예외다.
       (장르색 막대 위의 비율, 썸네일 위의 시간 배지) */
    --on-color: rgba(6, 7, 8, .78);
    --on-media: #fff;
    --scrim: rgba(6, 7, 8, .82);

    --radius-xs: 4px;
    --radius-s: 8px;
    --radius-m: 12px;
    --radius-pill: 999px;
    --content-max: 1280px;
    /* 폴백 순서를 명시한다. Pretendard와 SB 어그로에는 한자가 하나도 없고, 한국어 폰트도
       한자를 140~250자쯤 빠뜨린다. 한글 → 한자 → 가나·간체 → 기호 → 이모지 순으로 잇는다. */
    --font: "Pretendard", -apple-system, "Apple SD Gothic Neo",
            "Malgun Gothic", "Noto Sans CJK KR", "Yu Gothic", "Microsoft YaHei",
            "Segoe UI", system-ui, sans-serif,
            "Segoe UI Symbol", "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji";
    --font-display: "SB Aggro", "SB 어그로 M", var(--font);
  }

  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #F6F7F8;
    --surface: #FFFFFF;
    --surface-2: #E9EDF0;
    --line: #C8D0D7;
    --line-soft: #DCE2E7;
    --text: #11171D;
    --dim: #384550;
    --faint: #5B6874;
    --accent: #007A55;
    --mark: #087653;
    --eureka-green: #3E9664;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scrollbar-gutter: stable; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  /* 버튼·입력은 글꼴을 물려받지 않아 Arial 로 떨어진다. 화살표·기호가 본문과 달라 보였다. */
  button, input, select, textarea { font-family: inherit; }

  body {
    margin: 0; color: var(--text);
    /* 맨 뒤에 유레카 색 기운을 아주 옅게 깐다. 왼쪽 위에서 노랑, 오른쪽 위에서 연두.
       뜻을 갖는 색이 아니라 "이 집의 공기"다 — 3% 라 글자 대비에 영향이 없다. */
    background:
      radial-gradient(760px 420px at 8% -6%, rgba(255, 255, 66, .05), transparent 70%),
      radial-gradient(680px 380px at 88% -10%, rgba(115, 199, 148, .045), transparent 70%),
      var(--bg);
    background-attachment: fixed;
    font-family: var(--font); font-size: 16px; line-height: 1.6;
    /* 숫자는 본문/제목 서체로, 🍋 같은 기본 이모지만 이모지로 표시한다. */
    font-variant-emoji: unicode;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-variant-numeric: tabular-nums; }
  /* 사실을 잇는 가운뎃점. 곡 상세 전용이 아니라 여러 화면이 함께 쓰는 원시요소다 —
     song.css 에 두었더니 그 모듈을 안 싣는 최근 방송에서 색이 안 먹었다. */
  .sep { color: var(--faint); }

  /* ── 섬네일과 그 위의 배지 ─────────────────────────
     여러 화면이 같은 물건을 쓰는데 정의가 없어, 앵커 안의 배지가
     브라우저 기본 링크색(보라)에 밑줄로 나왔다. 사진 위는 본문 토큰이
     통하지 않는 자리라 --on-media / --scrim 을 쓴다. */
  .thumb-wrap { position: relative; }
  a.thumb-wrap { color: var(--on-media); text-decoration: none; }
  .thumb-badge {
    position: absolute; right: 8px; bottom: 8px;
    padding: 2px 8px; border-radius: var(--radius-pill);
    background: var(--scrim); color: var(--on-media);
    font-size: 12px; font-weight: 600; text-decoration: none;
  }

  /* 큰 섬네일의 공통 재생 유도. 화면마다 다른 플레이 버튼을 만들지 않는다. */
  .media-play-surface { transition: box-shadow 160ms ease-out; }
  .media-play-surface > .media-play-trigger {
    position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0;
    background: none; color: inherit; text-align: left; cursor: pointer;
  }
  .media-play-surface > .media-play-trigger:disabled { cursor: default; }
  .media-play-surface > .media-play-trigger:focus-visible {
    outline: 2px solid var(--accent); outline-offset: -3px;
  }

  /* 방송×곡 단위 상태는 새 배지를 만들지 않고 기존 타임스탬프 색으로 말한다. */
  .playback-time--on { color: var(--mark); }
  .playback-time--off { color: var(--faint); cursor: help; }
  /* unit.css의 기본 시간색보다 상태색이 우선한다. 모듈 조립 순서에 기대지 않는다. */
  .u-at.playback-time--on { color: var(--mark); }
  .u-at.playback-time--off { color: var(--faint); }
  .media-play-surface:has(.media-play-trigger:not(:disabled)):hover,
  .media-play-surface:has(.media-play-trigger:not(:disabled)):focus-within {
    box-shadow: 0 0 0 1px rgba(255, 255, 66, .78), 0 0 24px rgba(255, 255, 66, .28);
  }
  .media-play-trigger::after {
    content: "▶"; position: absolute; left: 50%; top: 50%; z-index: 3;
    transform: translate(-50%, -50%); display: grid; place-items: center;
    width: 48px; height: 48px; padding-left: 4px; box-sizing: border-box;
    border: 2px solid rgba(255, 255, 255, .82); border-radius: var(--radius-pill);
    background: rgba(6, 7, 8, .42); color: #fff; font-size: 16px; line-height: 1;
    opacity: .8; pointer-events: none;
    transition: background 160ms ease-out, transform 160ms ease-out, opacity 160ms ease-out;
  }
  .media-play-trigger:disabled::after { display: none; }
  .media-play-surface:hover .media-play-trigger::after,
  .media-play-trigger:hover::after,
  .media-play-trigger:focus-visible::after {
    opacity: 1; background: rgba(6, 7, 8, .68); transform: translate(-50%, -50%) scale(1.08);
  }
  @media (prefers-reduced-motion: reduce) {
    .media-play-surface, .media-play-trigger::after { transition: none; }
    .media-play-surface:hover .media-play-trigger::after,
    .media-play-trigger:hover::after,
    .media-play-trigger:focus-visible::after { transform: translate(-50%, -50%); }
  }
  main { max-width: var(--content-max); margin: 0 auto; padding: 36px 24px 36px; }
  @media (max-width: 860px) {
    main { padding-left: 16px; padding-right: 16px; }
  }

  /* 1440p 이상에서는 영상·달력·차트처럼 폭이 곧 정보량인 화면만 넓힌다.
     목록·읽기 화면까지 비례 확대하면 항목 사이 거리만 벌어진다. */
  @media (min-width: 2000px) {
    body:is([data-page="main"], [data-page="archive"], [data-page="stats"]) {
      --content-max: 1600px;
    }
  }

  .page-intro { display: flex; flex-direction: column; gap: 8px; margin-bottom: 28px; }
  .page-intro h1 {
    margin: 0; font-family: var(--font-display); font-size: 30px;
    font-weight: 500; line-height: 1.25; letter-spacing: -.005em;
  }
  .page-intro p { margin: 0; color: var(--dim); font-size: 14px; }
  .page-kicker {
    color: var(--accent); font-size: 14px; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase;
  }
  .archive-path {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 1px; margin-top: 16px; overflow: hidden;
    border: 1px solid var(--line); border-radius: var(--radius-m); background: var(--line);
  }
  .archive-path a {
    min-width: 0; display: flex; gap: 12px; align-items: flex-start; padding: 12px;
    background: var(--surface); color: var(--text); text-decoration: none;
    transition: background 140ms ease-out;
  }
  .archive-path a:hover { background: var(--surface-2); }
  .archive-path b { color: var(--mark); font-size: 12px; font-weight: 600; }
  .archive-path span { display: flex; flex-direction: column; min-width: 0; font-size: 14px; font-weight: 600; }
  .archive-path small { color: var(--faint); font-size: 12px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  @media (max-width: 760px) {
    .archive-path { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  /* ── 상단 바 ─────────────────────────────────────── */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: rgba(14, 15, 17, .94); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line-soft);
  }
  .topbar-inner {
    max-width: var(--content-max); margin: 0 auto; padding: 16px 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .brand {
    font-family: var(--font-display); font-weight: 500; font-size: 20px;
    letter-spacing: -.005em; margin: 0; white-space: nowrap;
  }
  .brand-sub { color: var(--faint); font-size: 14px; white-space: nowrap; }
  .search {
    flex: 1 1 240px; min-width: 180px; display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-pill); padding: 8px 16px;
  }
  .search:focus-within { border-color: var(--mark); }
  .search input {
    flex: 1; background: none; border: 0; padding: 0; color: var(--text);
    font: inherit; font-size: 14px; outline: none; min-width: 0;
  }
  .search input::placeholder { color: var(--faint); }
  .search button {
    background: none; border: 0; color: var(--faint); font: inherit;
    cursor: pointer; padding: 0 4px; font-size: 16px;
  }
  .search button:hover { color: var(--text); }
  .topbar a.stats {
    font-size: 14px; color: var(--dim); text-decoration: none;
    border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 4px 16px; white-space: nowrap;
  }
  .topbar a.stats:hover { color: var(--text); border-color: var(--faint); }

  /* ── 공통 ────────────────────────────────────────── */
  section { margin-bottom: 36px; }
  .sec-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .sec-title {
    font-family: var(--font-display); font-weight: 500; font-size: 20px;
    letter-spacing: -.005em; margin: 0;
  }
  :root[data-theme="light"] .topbar { background: rgba(246, 247, 248, .94); }
  .sec-title a { color: inherit; text-decoration: none; }
  .sec-title a:hover { text-decoration: underline; text-underline-offset: 5px; }
  .sec-why { color: var(--faint); font-size: 14px; }
  .sec-act {
    margin-left: auto; background: none; border: 0; color: var(--mark);
    font: inherit; font-size: 14px; cursor: pointer; padding: 0;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .sec-act:hover { color: var(--accent); }

  /* 초점 표시의 바닥값 — 요소마다 따로 적다 보면 반드시 빠뜨린다.
     실제로 검색창·상단 이동 링크·썸네일·미확인곡 링크가 표시 없이 남아 있었다.
     개별 규칙은 그대로 두고(모양을 다듬는 용도), 여기서 최소한을 보장한다. */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 제목은 홈으로 가는 길 — 글자 모양은 그대로 두고 동작만 준다 */
  .brand a { color: inherit; text-decoration: none; }
  .brand a:hover { color: var(--text); }

  /* ── 이동 ──────────────────────────────────────────
     PC 는 왼쪽 기둥, 모바일은 아래 띠. 둘은 같은 물건이 아니라 각자 만든다. */
  :root { --side-w: 232px; }

  .side {
    position: fixed; left: 0; top: 0; bottom: 0; width: var(--side-w); z-index: 20;
    display: flex; flex-direction: column; gap: 30px;
    padding: 28px 18px; background: var(--surface); border-right: 1px solid var(--line);
    overflow-y: auto;
  }
  .side-head { display: flex; align-items: flex-start; gap: 8px; }
  .side-brand {
    display: flex; flex: 1; flex-direction: column; gap: 4px; min-width: 0;
    color: var(--text); text-decoration: none;
  }
  .side-brand-t {
    font-family: var(--font-display); font-weight: 500; font-size: 20px;
    color: var(--text); letter-spacing: -.005em;
    display: inline-flex; align-items: center; gap: 8px;
  }
  /* Claude 시안의 레몬 재생 시그니처. 녹색 껍질만 주기적으로 회전한다. */
  .eu-mark {
    position: relative; display: inline-block; width: 1em; height: 1em; flex: none;
    overflow: hidden; border-radius: 50%; background: var(--eureka-yellow); font-size: 18px;
  }
  .eu-mark::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle closest-side at center,
      transparent 0 78%, var(--eureka-green) 82% 100%);
    -webkit-mask-image: conic-gradient(from 285deg, #000 0 60deg, transparent 60deg 360deg);
    mask-image: conic-gradient(from 285deg, #000 0 60deg, transparent 60deg 360deg);
    animation: eu-rind 7s cubic-bezier(.62, 0, .34, 1) infinite;
  }
  .eu-mark::after {
    content: ""; position: absolute; left: 45.8%; top: 30.6%; width: 30.6%; height: 38.8%;
    background: #04140f; clip-path: polygon(0 0, 100% 50%, 0 100%);
  }
  @keyframes eu-rind {
    0%, 62% { transform: rotate(0); }
    100% { transform: rotate(360deg); }
  }
  .side-brand-s { margin-left: 28px; font-size: 12px; color: var(--faint); }
  .theme-toggle {
    flex: none; display: grid; place-items: center; width: 32px; height: 32px; padding: 0;
    border: 1px solid var(--line); border-radius: var(--radius-pill);
    background: transparent; color: var(--dim); font-size: 16px; line-height: 1; cursor: pointer;
    transition: color 120ms ease-out, border-color 120ms ease-out, background 120ms ease-out;
  }
  .theme-toggle:hover { color: var(--text); border-color: var(--faint); background: var(--surface-2); }

  .side-list { display: flex; flex-direction: column; gap: 4px; }
  .side-item {
    display: flex; align-items: center; gap: 14px; min-height: 42px; padding: 10px 14px;
    border-left: 2px solid transparent; border-radius: 0; color: var(--dim); text-decoration: none; font-size: 14px;
    transition: background 120ms ease-out, color 120ms ease-out;
  }
  .side-item:hover { background: var(--surface-2); color: var(--text); }
  /* 지금 어디인지는 색이 아니라 왼쪽 표시로 — 강조색은 한 가지 뜻만 갖는다 */
  .side-item[aria-current="page"] {
    color: var(--text); font-weight: 700; border-left-color: var(--accent);
  }
  .side-icon { width: 18px; text-align: center; color: var(--faint); font-size: 12px; }
  .side-item[aria-current="page"] .side-icon { color: var(--accent); }
  .side-foot { margin-top: auto; font-size: 12px; color: var(--faint); padding: 0 8px; }
  .side-search-slot { height: 40px; flex: none; }
  .side-new { border-top: 1px solid var(--line); padding: 20px 8px 0; }
  .side-new h2 { display: flex; justify-content: space-between; gap: 8px; margin: 0 0 12px; font-family: inherit; font-weight: 500; font-size: 12px; color: var(--dim); }
  .side-new h2 span { color: var(--accent); }
  .side-new-list { max-height: 260px; overflow-y: auto; scrollbar-width: thin; }
  .side-new-song { display: grid; grid-template-columns: minmax(0,1fr) auto; align-items: baseline; gap: 3px 10px; padding: 9px 2px; text-decoration: none; color: var(--text); font-size: 13px; line-height: 1.45; }
  .side-new-song > span { min-width: 0; overflow-wrap: anywhere; }
  .side-new-song time { font-size: 12px; color: var(--dim); white-space: nowrap; text-align: right; }
  .side-new-song small { grid-column: 1 / -1; font-size: 12px; color: var(--faint); }
  .side-new-song:hover { color: var(--accent); }
  .side-new-song:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* 사이드바를 뺀 나머지 화면 안에서 모든 페이지를 같은 폭으로 가운데 정렬한다. */
  body.has-side { padding-left: var(--side-w); }

  /* 모바일 전용 부분은 넓은 화면에서 존재하지 않는다 */
  .mtop, .mtabs { display: none; }
  .mtop-brand .eu-mark { font-size: 14px; }
  .mtabs-space { height: 0; }

  @media (prefers-reduced-motion: reduce) {
    .eu-mark::before { animation: none; }
  }

  @media (max-width: 1079px) {
    .side { display: none; }
    body.has-side { padding-left: 0; }
    /* 아래 띠가 마지막 줄을 덮지 않도록 자리만 차지한다 */
    .mtabs-space { height: 56px; }

    /* 위에는 이름과 찾기만 — 이동은 아래 띠가 맡는다 */
    .mtop {
      position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px;
      padding: 8px 16px; background: var(--bg); border-bottom: 1px solid var(--line-soft);
    }
    .mtop-brand {
      font-family: var(--font-display); font-weight: 500; font-size: 16px;
      color: var(--text); text-decoration: none;
      display: inline-flex; align-items: center; gap: 8px; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .mtop .theme-toggle { margin-left: auto; }
    .mtop-find {
      background: none; border: 1px solid var(--line); color: var(--dim);
      width: 36px; height: 36px; border-radius: var(--radius-pill); font-size: 16px;
      cursor: pointer; padding: 0;
    }

    /* 엄지에 닿는 자리. 5개 핵심 탭 균등 배치 */
    .mtabs {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: var(--surface); border-top: 1px solid var(--line-soft);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .mtab {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 8px 4px; color: var(--faint); text-decoration: none; font-size: 12px;
    }
    .mtab-icon { font-size: 16px; line-height: 1; }
    /* 다섯 칸을 균등 분할하므로 글자가 접히면 띠 높이가 들쭉날쭉해진다 */
    .mtab-label { white-space: nowrap; }
    .mtab[aria-current="page"] { color: var(--accent); }

    /* 검색은 평소 감춰 두고 찾기를 누를 때만 위에 띄운다 */
    .side-search {
      position: fixed; left: 0; right: 0; top: 52px; z-index: 19;
      padding: 8px 16px; background: var(--bg); border-bottom: 1px solid var(--line-soft);
      display: none;
    }
    body.find-open .side-search { display: block; }
    body.find-open .mtop { margin-bottom: 56px; }
    .side-search-slot { display: none; }
  }

/* 요약 → 분류와 대표곡 → 시간 분포 → 누적/연속 기록. 바깥 카드는 두지 않는다. */
.stats-page { display: flex; flex-direction: column; gap: 0; }
.stats-page { --on-color: #060708; }
:root[data-theme="light"] .stats-page { --faint: var(--dim); }
.stats-page > *, .stats-panel { margin: 0; min-width: 0; }
.stats-period { font-size: 12px; color: var(--faint); }
.stats-page .page-intro { margin-bottom: 18px; }
.stats-summary { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); padding: 16px 0 22px; border-bottom: 1px solid var(--line); }
.stats-fact { padding: 0 20px; border-left: 1px solid var(--line); }
.stats-fact:first-child { padding-left: 0; border-left: 0; }
.stats-fact small { display: block; color: var(--faint); font-size: 12px; }
.stats-fact b { display: block; margin-top: 3px; font-size: 22px; font-weight: 500; }
.stats-panel { padding: 28px 0; border-bottom: 1px solid var(--line); }
.stats-panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.stats-panel h2 { margin: 0; font-family: var(--font-display); font-size: 20px; font-weight: 500; line-height: 1.35; }
.stats-panel-head small, .stats-empty { color: var(--faint); font-size: 12px; }
.genre-compare-bars { display: grid; gap: 10px; }
.genre-compare-line { display: grid; grid-template-columns: 82px minmax(0,1fr) 64px; gap: 12px; align-items: center; font-size: 12px; color: var(--dim); }
.genre-compare-line > .num { text-align: right; }
.genre-composition { display: flex; height: 28px; min-width: 0; border-radius: var(--radius-xs); overflow: hidden; background: var(--surface-2); }
.genre-composition > span { container-type: inline-size; display: grid; place-items: center; min-width: 0; overflow: hidden; white-space: nowrap; font-size: 12px; font-weight: 600; color: var(--on-color); }
.genre-composition-label { visibility: hidden; }
@container (min-width: 110px) { .genre-composition-label { visibility: visible; } }
.genre-compare-list { margin-top: 18px; border-top: 1px solid var(--line); }
.genre-compare-row { min-height: 68px; display: grid; grid-template-columns: minmax(100px,.7fr) minmax(220px,1.5fr) minmax(360px,1.8fr); gap: 18px; align-items: center; border-bottom: 1px solid var(--line); font-size: 12px; }
.genre-name { display: inline-flex; gap: 8px; align-items: center; font-size: 12px; color: var(--text); text-decoration: none; }
.genre-pair { min-width: 0; display: grid; gap: 5px; }
.genre-measure { display: grid; grid-template-columns: 48px minmax(0,1fr) 34px; gap: 8px; align-items: center; color: var(--faint); }
.genre-measure-track { height: 4px; overflow: hidden; background: var(--surface-2); }
.genre-measure-track i { display: block; height: 100%; }
.genre-measure b { color: var(--dim); font-size: 12px; font-weight: 500; text-align: right; }
.genre-name i { width: 8px; height: 8px; flex: none; border-radius: 50%; }
.genre-top { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; min-width: 0; }
.genre-top-song { display: grid; grid-template-columns: 46px minmax(0,1fr); gap: 8px; align-items: center; min-width: 0; color: inherit; text-decoration: none; }
.genre-top-song img { display: block; width: 46px; height: 30px; object-fit: cover; border-radius: 4px; }
.genre-top-song span { min-width: 0; }
.genre-top-song b { display: block; font-size: 12px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.genre-top-song small { display: block; font-size: 12px; color: var(--faint); margin-top: 2px; }
.genre-top-song:hover b, a.genre-name:hover { text-decoration: underline; text-underline-offset: 3px; }
.stats-runtime { padding-bottom: 24px; border-bottom: 1px solid var(--line); }
.runtime-chart { margin: 0; padding: 20px 18px 6px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.runtime-axis { display: flex; justify-content: space-between; color: var(--faint); font-size: 12px; }
.runtime-distribution { position: relative; height: 132px; margin-top: 8px; }
.runtime-box-layer { position: relative; height: 100%; }
.runtime-distribution::before { content: ''; position: absolute; top: 104px; left: 0; right: 0; height: 1px; background: var(--line); }
.runtime-guide { position: absolute; top: calc(var(--guide-row) * 22px); height: calc(104px - var(--guide-row) * 22px); border-left: 1px dashed var(--faint); color: var(--dim); }
.runtime-guide > span { position: absolute; white-space: nowrap; top: 0; transform: translateX(-50%); background: var(--bg); font-size: 12px; padding: 0 4px; }
.runtime-points { position: absolute; top: 70px; left: 0; right: 0; height: 64px; max-height: 196px; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }
.runtime-track { position: relative; height: 64px; }
.runtime-distribution, .runtime-axis { margin-left: 16px; margin-right: 16px; }
.runtime-whisker { position: absolute; top: 104px; height: 3px; background: var(--dim); transform: translateY(-50%); }
.runtime-whisker::before, .runtime-whisker::after { content: ''; position: absolute; top: -8px; width: 1px; height: 18px; background: var(--dim); }
.runtime-whisker::before { left: 0; } .runtime-whisker::after { right: 0; }
.runtime-box { position: absolute; top: 104px; height: 34px; transform: translateY(-50%); border: 2px solid var(--mark); border-radius: 5px; background: color-mix(in srgb,var(--mark) 10%,transparent); }
.runtime-median { position: absolute; top: 104px; height: 38px; width: 3px; transform: translate(-50%,-50%); background: var(--mark); }
.runtime-dot { position: absolute; top: var(--point-y); width: 13px; height: 13px; display: grid; place-items: center; padding: 0; transform: translate(-50%,-50%); border-radius: 50%; }
.runtime-dot::after { content: ''; width: 13px; height: 13px; border: 2px solid var(--bg); border-radius: 50%; background: var(--eureka-yellow,var(--lemon,#FFFF66)); box-shadow: 0 0 0 1px var(--line-strong); }
.runtime-dot.outlier::after { background: var(--bg); border-color: var(--mark); box-shadow: none; }
.runtime-dot:hover, .runtime-dot:focus-visible { z-index: 2; outline: 2px solid var(--text); outline-offset: 2px; }
.runtime-marks { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 12px; padding-top: 12px; border-top: 1px solid var(--line-soft); }
.runtime-mark small, .runtime-mark b { display: block; color: var(--faint); font-size: 12px; font-weight: 400; }
.runtime-mark b { color: var(--text); margin-top: 4px; }
.runtime-selection { display: block; min-height: 24px; margin-top: 8px; color: var(--dim); font-size: 12px; }
.runtime-preview { position: fixed; z-index: 100; display: grid; grid-template-columns: 120px minmax(0,1fr); gap: 12px; width: 360px; max-width: calc(100vw - 16px); padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--text); box-shadow: 0 4px 20px #0002; }
.runtime-preview[hidden] { display: none; }
.runtime-preview img { width: 120px; aspect-ratio: 16/9; object-fit: cover; border-radius: 4px; }
.runtime-preview time,.runtime-preview b,.runtime-preview span { display: block; font-size: 12px; }
.runtime-preview b { margin: 4px 0; font-weight: 500; overflow-wrap: anywhere; }
.runtime-preview time,.runtime-preview span { color: var(--dim); }
.stats-record-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); border-bottom: 1px solid var(--line); }
.stats-record-grid > .stats-panel { border-bottom: 0; }
.stats-record-grid > :first-child { padding-right: 24px; }
.stats-record-grid > :last-child { padding-left: 24px; border-left: 1px solid var(--line); }
.record-list, .streak-list { border-top: 1px solid var(--line); }
.record-list[data-paged="true"], .streak-list[data-paged="true"] { min-height: 529px; }
.record-row, .streak-row { min-height: 44px; display: grid; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
.record-row { grid-template-columns: 28px minmax(0,1fr) 46px; }
.record-rank { color: var(--faint); font-size: 12px; }
.record-song, .streak-song { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--text); text-decoration: none; }
.record-song small { color: var(--faint); margin-left: 8px; font-size: 12px; }
.record-count, .streak-max { font-size: 12px; font-weight: 600; text-align: right; }
.record-row:hover .record-song, .streak-song:hover { text-decoration: underline; text-underline-offset: 3px; }
.streak-row { grid-template-columns: minmax(0,1fr) 40px minmax(72px,112px) 40px 48px; gap: 6px; list-style: none; cursor: pointer; }
.streak-row::-webkit-details-marker { display: none; }
.streak-max::after { content: '⌄'; display: inline-block; margin-left: 4px; }
.streak-entry[open] .streak-max::after { transform: rotate(180deg); }
.streak-row:hover .streak-max, .streak-entry[open] .streak-max { color: var(--mark); text-decoration: underline; text-underline-offset: 3px; }
.streak-dates { display: grid; grid-template-columns: repeat(auto-fit,minmax(94px,1fr)); gap: 4px 8px; max-height: 208px; overflow-y: auto; padding: 4px 4px 12px; border-bottom: 1px solid var(--line-soft); }
.streak-broadcast { display: grid; place-items: center; min-height: 40px; color: var(--dim); font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }
.streak-broadcast:hover { color: var(--text); background: var(--surface-2); }
.streak-date { font-size: 12px; color: var(--faint); text-align: center; }
.streak-run { position: relative; display: grid; grid-template-columns: repeat(var(--streak-count),1fr); justify-self: start; align-items: center; }
.streak-run::before { content: ''; position: absolute; left: 0; right: 0; height: 5px; background: var(--streak-color); border-radius: 3px; }
.streak-point { position: relative; display: grid; place-items: center; min-width: 0; height: 24px; }
.streak-point::after { content: ''; width: min(8px,100%); height: 8px; border-radius: 50%; background: var(--streak-color); box-shadow: 0 0 0 1px var(--bg); }
.record-pages { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-top: 12px; color: var(--faint); font-size: 12px; }
.record-pages button { width: 32px; height: 32px; border: 1px solid var(--line); border-radius: var(--radius-xs); background: transparent; color: var(--text); cursor: pointer; }
.record-pages button:disabled { opacity: .4; cursor: default; }

    /* 주소는 반드시 큰따옴표 문자열에서 시작해야 한다 —
       배포본(--pages)이 `"./` 을 `"./` 로 바꾸는데, 백틱으로 조립하면 그 치환을 비켜간다.

    const HOME = "./";

    const themeButtons = [];
    const syncThemeButtons = () => {
      const light = document.documentElement.dataset.theme === "light";

        button.textContent = light ? "☾" : "☀";
        button.setAttribute("aria-pressed", String(light));
        button.setAttribute("aria-label", light ? "다크 모드로 전환" : "라이트 모드로 전환");
        button.title = button.getAttribute("aria-label");
      }
    };
    const makeThemeButton = () => {
      const button = mk("button", "theme-toggle");
      button.type = "button";
      button.addEventListener("click", () => {
        const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem("rekatime-theme", next); } catch (e) {}
        syncThemeButtons();
      });
      themeButtons.push(button);
      syncThemeButtons();
      return button;
    };

    /* 최신 방송을 보는 일과 지난 방송을 훑는 일은 서로 다른 사용자 의도다. */
    const ITEMS = [
      { id: "main",    label: "최근 방송", label2: "최근", href: HOME,           icon: "◉" },
      { id: "archive", label: "월간 정리", label2: "월간", href: "archive.html", icon: "▦" },
      { id: "song",    label: "노래책",    label2: "노래책", href: "song.html",    icon: "♫" },
      { id: "stats",   label: "통계",      label2: "통계", href: "stats.html",   icon: "◫" },
      { id: "info",    label: "사이트 정보", label2: "정보", href: "info.html",   icon: "ⓘ" },
    ];

    /* ── PC: 왼쪽 기둥 ── */
    const side = mk("nav", "side");
    side.setAttribute("aria-label", "페이지 이동");

    const brand = mk("a", "side-brand");
    brand.href = HOME;
    /* 이름 옆의 작은 표식 하나. 유레카 개인색(노랑→연두)을 쓰는 자리는 여기처럼
       색이 데이터를 뜻하지 않는 곳뿐이다. 🍋 이 늘 붙는 방송 제목과 같은 결이다. */
    const name = mk("span", "side-brand-t");
    name.append(mk("i", "eu-mark"), document.createTextNode("레카타임"));
    brand.append(name, mk("span", "side-brand-s", "LIVE ARCHIVE"));
    const sideHead = mk("div", "side-head");
    sideHead.append(brand, makeThemeButton());
    side.append(sideHead);

    /* 검색 상자가 얹힐 자리. 검색을 싣지 않는 화면(개별 방송·노래)에서는
       40px 빈 칸만 남아 브랜드와 이동 목록 사이가 이유 없이 벌어져 있었다.
       놓을 것이 있을 때만 자리를 만든다. */
    if (document.getElementById("nav-search-mount")) {
      const slot = mk("div", "side-search-slot");
      slot.id = "nav-search";
      side.append(slot);
    }

    const list = mk("div", "side-list");
    for (const it of ITEMS) {
      const a = mk("a", "side-item");
      a.href = it.href;
      if (it.id === here || (here === "broadcast" && it.id === "archive"))
        a.setAttribute("aria-current", "page");
      a.append(mk("span", "side-icon", it.icon), mk("span", null, it.label));
      list.append(a);
    }
    side.append(list);

    const catalog = JSON.parse(document.getElementById("nav-catalog")?.textContent || "{}");
    const waiting = (catalog.songs || [])
      .filter(song => RekaCatalogMetrics.isNew(song, RekaCatalogMetrics.newReference(catalog)))
      .sort((a, b) => b.added_at.localeCompare(a.added_at) || a.t.localeCompare(b.t, "ko"));
    if (waiting.length) {
      const section = mk("section", "side-new"), heading = mk("h2", null, "새로 추가된 신곡");
      heading.append(mk("span", "num", String(waiting.length)));
      const songs = mk("div", "side-new-list");
      for (const song of waiting) {
        const link = mk("a", "side-new-song");
        link.href = "song.html?id=" + encodeURIComponent(song.id);
        link.title = `${song.t} · ${song.a || ""} · ${song.added_at} 추가`;
        const added = mk("time", "num", `${Number(song.added_at.slice(5, 7))}월 ${Number(song.added_at.slice(8, 10))}일`);
        added.dateTime = song.added_at;
        added.setAttribute("aria-label", `${song.added_at} 추가`);
        link.append(mk("span", null, song.t), added, mk("small", null, song.a || ""));
        songs.append(link);
      }
      section.append(heading, songs);side.append(section);
    }

    const foot = mk("div", "side-foot");
    foot.id = "nav-foot";
    side.append(foot);

    /* ── 모바일: 위 이름띠 + 아래 이동띠 ── */
    const top = mk("div", "mtop");
    const mbrand = mk("a", "mtop-brand");
    mbrand.append(mk("i", "eu-mark"), document.createTextNode("레카타임 라이브 아카이브"));
    mbrand.href = HOME;
    const mfind = mk("button", "mtop-find");
    mfind.type = "button";
    mfind.setAttribute("aria-label", "곡 찾기");
    mfind.textContent = "⌕";
    top.append(mbrand, makeThemeButton(), mfind);

    const tabs = mk("nav", "mtabs");
    tabs.setAttribute("aria-label", "페이지 이동");
    for (const it of ITEMS) {
      const a = mk("a", "mtab");
      a.href = it.href;
      if (it.id === here || (here === "broadcast" && it.id === "archive"))
        a.setAttribute("aria-current", "page");
      a.append(mk("span", "mtab-icon", it.icon), mk("span", "mtab-label", it.label2 || it.label));
      tabs.append(a);
    }

    const spacer = mk("div", "mtabs-space");
    document.body.prepend(top, side);
    document.body.append(spacer, tabs);
    document.body.classList.add("has-side");

    /* 모바일의 찾기 단추는 검색 상자를 화면 위로 띄운다 */
    mfind.addEventListener("click", () => {
      const jumpInput = document.getElementById("q");
      if (jumpInput) {
        document.body.classList.toggle("find-open");
        if (document.body.classList.contains("find-open")) jumpInput.focus();
        return;
      }
      const bookInput = document.getElementById("book-q");
      if (bookInput && !bookInput.closest("[hidden]")) {
        bookInput.scrollIntoView({ block: "center" });
        bookInput.focus();
        return;
      }
      location.href = "song.html?focus=search";
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") document.body.classList.remove("find-open");
    });
  })();

/* 통계는 최근 방송과 같은 공개 블록을 집계한다. 미매칭 기록도 합계에서 빼지 않는다. */
const RekaStatsMetrics = (() => {
  const order = ["VOCALOID", "J-POP/애니", "ENGLISH/영어", "KOREAN/한국어", "OTHERS/기타", "미분류"];
  const category = value => order.includes(value) ? value : "미분류";
  const rank = (a,b) => b.takes.length-a.takes.length || b.last_date.localeCompare(a.last_date) || a.title.localeCompare(b.title,"ko");
  function distribution(values) {
    const sorted=values.filter(Number.isFinite).sort((a,b)=>a-b);
    if(!sorted.length)return null;
    const q=p=>{const index=(sorted.length-1)*p,lo=Math.floor(index),hi=Math.ceil(index);return sorted[lo]+(sorted[hi]-sorted[lo])*(index-lo);};
    const q1=q(.25),median=q(.5),q3=q(.75),iqr=q3-q1;
    const lowFence=q1-1.5*iqr,highFence=q3+1.5*iqr,inner=sorted.filter(n=>n>=lowFence&&n<=highFence);
    return {min:sorted[0],q1,median,q3,max:sorted.at(-1),low:inner[0],high:inner.at(-1),lowFence,highFence};
  }
  function build(main) {
    const byId=new Map((main.songs||[]).map(s=>[s.song_id,s])),byPerformance=new Map();
    for(const song of main.songs||[])for(const take of song.takes||[])if(take.perf_id)byPerformance.set(take.perf_id,{song,take});
    const songs=new Map(),genres=new Map(order.map(genre=>[genre,{genre,catalog_count:0,performed_count:0,songs:new Map()}]));
    for(const item of main.book||[])genres.get(category(item.g)).catalog_count++;
    const sessions=[...(main.sessions||[])].filter(s=>s.blocks?.length).sort((a,b)=>a.date.localeCompare(b.date)||(a.session_id||"").localeCompare(b.session_id||""));
    let performances=0,sing_seconds=0;
    const rows=sessions.map(session=>{
      let seconds=0;
      const setlist=session.blocks.map(block=>{
        const hit=byPerformance.get(block.perf_id),meta=byId.get(block.song_id)||hit?.song;
        const id=meta?.song_id||block.song_id||"",genre=category(block.g),duration=Math.max(0,Number(block.d)||0);
        const take={perf_id:block.perf_id,session_id:session.session_id,date:session.date,thumb:block.thumb||hit?.take.thumb,duration};
        performances++;seconds+=duration;genres.get(genre).performed_count++;
        if(id){
          if(!songs.has(id))songs.set(id,{song_id:id,title:meta?.title||block.t,artist:meta?.artist||block.a||"",genre,takes:[],last_date:session.date});
          const song=songs.get(id);song.takes.push(take);song.last_date=session.date;
          const group=genres.get(genre).songs;
          if(!group.has(id))group.set(id,{...song,takes:[]});
          group.get(id).takes.push(take);group.get(id).last_date=session.date;
        }
        return {id,t:block.t,a:block.a,g:genre,d:duration,perf_id:block.perf_id};
      });
      sing_seconds+=seconds;
      return {session_id:session.session_id,date:session.date,title:session.title||"",thumb:session.blocks.find(b=>b.thumb)?.thumb||"",seconds,setlist};
    });
    const records=[...songs.values()].sort(rank);
    const sessionSets=rows.map(s=>new Set(s.setlist.map(b=>b.id).filter(Boolean))),streaks=[];
    for(const meta of records){
      let best=0,current=0,start=0,bestStart=0,bestEnd=0;
      sessionSets.forEach((set,index)=>{
        if(set.has(meta.song_id)){if(!current)start=index;current++;if(current>best){best=current;bestStart=start;bestEnd=index;}}
        else current=0;
      });
      if(best>=3)streaks.push({id:meta.song_id,meta,best,bestStart,bestEnd});
    }
    streaks.sort((a,b)=>b.best-a.best||a.meta.title.localeCompare(b.meta.title,"ko"));
    const catalog_songs=(main.book||[]).length;
    return {
      overview:{sessions:rows.length,performances,catalog_songs,unique_songs:records.length,sing_seconds,sing_hours:sing_seconds/3600,date_first:rows[0]?.date||"",date_last:rows.at(-1)?.date||""},
      sessions:rows,songs:records,streaks,
      genres:[...genres.values()].filter(g=>g.catalog_count||g.performed_count).map(g=>({genre:g.genre,catalog_count:g.catalog_count,performed_count:g.performed_count,catalog_share:g.catalog_count/(catalog_songs||1),performed_share:g.performed_count/(performances||1),top:[...g.songs.values()].sort(rank).slice(0,3)})),
      distribution:distribution(rows.map(s=>s.seconds)),
    };
  }
  return Object.freeze({build,distribution});
})();

/* 시안과 실제 페이지가 같은 통계 렌더러를 사용한다. 경로/글꼴은 각 화면의 기존 규격을 따른다. */
function renderStatsPage(root,D,{el,genreColor,genreLabel,songTimeLabel,songUrl,recentBroadcastUrl,bookUrl,thumbnail=take=>D.thumbs?.[take?.thumb]||D.placeholder}) {
  root.innerHTML = `
  <header class="page-intro">
    <span class="page-kicker">rekatime-clips · 통계</span>
    <h1>유레카 노래 기록</h1>
    <span class="stats-period num" id="stats-period"></span>
  </header>
  <section class="stats-summary" id="stats-summary" aria-label="노래 기록 요약"></section>
  <section class="stats-panel stats-genre">
    <header class="stats-panel-head"><h2>장르 구성</h2></header>
    <div id="genre-comp"></div>
  </section>
  <section class="stats-panel stats-runtime">
    <header class="stats-panel-head"><h2>노래 시간</h2></header>
    <figure class="runtime-chart" id="runtime-boxplots" aria-label="노래 시간 박스 플롯"></figure>
  </section>
  <div class="stats-record-grid">

      <header class="stats-panel-head"><h2>최대 기록</h2><small>누적 노래 횟수</small></header>
      <div class="record-list" id="record-list"></div>
      <nav class="record-pages" id="record-pages" aria-label="최대 기록 페이지"></nav>
    </section>
    <section class="stats-panel stats-streak">
      <header class="stats-panel-head"><h2>최대 연속 기록</h2><small id="streak-count"></small></header>
      <div class="streak-list" id="streak-list"></div>
      <nav class="record-pages" id="streak-pages" aria-label="최대 연속 기록 페이지"></nav>
    </section>
  </div>
`;
  let observer,disposePreview=()=>{};
const query=new URLSearchParams(location.search),pages={},songLinks=new Set();
let initialized=false,disposed=false;
const trackSong=(link,key)=>{link.dataset.statsFocus=key;songLinks.add(link);return link;};
function syncNavigation(changed=false){
  if(changed){
    const url=new URL(location.href);url.searchParams.delete("statsFocus");
    for(const [key,value] of Object.entries(pages))value===1?url.searchParams.delete(key):url.searchParams.set(key,String(value));
    history.replaceState(history.state,"",url);
  }
  for(const link of songLinks){
    if(!root.contains(link)){songLinks.delete(link);continue;}
    const url=new URL(link.href,location.href);url.searchParams.set("fromStats","1");
    for(const [key,value] of Object.entries(pages))url.searchParams.set(key,String(value));
    url.searchParams.set("statsFocus",link.dataset.statsFocus);link.href=url.href;
  }
}
const stats=RekaStatsMetrics.build(D),o=stats.overview;
root.querySelector("#stats-period").textContent=o.date_first?o.date_first+" — "+o.date_last:"";
const summary=root.querySelector("#stats-summary");
for(const [label,value] of [["노래방",o.sessions+"회"],["노래",o.performances+"번"],["노래한 시간",songTimeLabel(o.sing_seconds)],["방송당 평균",Math.round(o.performances/(o.sessions||1))+"곡"]]){
  const fact=el("div","stats-fact");fact.append(el("small",null,label),el("b","num",value));summary.append(fact);
}
const genreBox=root.querySelector("#genre-comp"),bars=el("div","genre-compare-bars");
for(const [label,key,total,unit] of [["노래책","catalog_share",o.catalog_songs,"곡"],["실제 노래","performed_share",o.performances,"번"]]){
  const line=el("div","genre-compare-line"),bar=el("div","genre-composition");
  bar.setAttribute("aria-label",label+" 장르 비율");
  for(const genre of stats.genres){
    const share=genre[key];if(!share)continue;
    const label=genreLabel(genre.genre)+" "+(share<.01?"<1":Math.round(share*100))+"%",segment=el("span");
    segment.append(el("span","genre-composition-label",label));
    segment.style.width=share*100+"%";segment.style.background=genreColor(genre.genre);segment.title=label;segment.setAttribute("aria-label",label);bar.append(segment);
  }
  line.append(el("span",null,label),bar,el("span","num",total+unit));bars.append(line);
}
genreBox.append(bars);
const genres=el("div","genre-compare-list");
for(const genre of stats.genres){
  const row=el("div","genre-compare-row"),name=el(genre.genre==="미분류"?"span":"a","genre-name"),dot=el("i");dot.style.background=genreColor(genre.genre);
  name.append(dot,document.createTextNode(genreLabel(genre.genre)));
  if(genre.genre!=="미분류")name.href=bookUrl("genre="+encodeURIComponent(genre.genre));
  const pair=el("div","genre-pair");
  for(const [label,key] of [["노래책","catalog_share"],["실제","performed_share"]]){
    const measure=el("div","genre-measure"),track=el("span","genre-measure-track"),fill=el("i");
    fill.style.width=genre[key]*100+"%";fill.style.background=genreColor(genre.genre);track.append(fill);
    measure.append(el("span",null,label),track,el("b","num",Math.round(genre[key]*100)+"%"));pair.append(measure);

  const top=el("div","genre-top");top.setAttribute("aria-label",genreLabel(genre.genre)+" 대표곡 Top 3");
  genre.top.forEach((song,index)=>{

    const copy=el("span");copy.append(el("b",null,song.title),el("small","num",(index+1)+"위 · "+song.takes.length+"번"));link.append(image,copy);top.append(link);

genreBox.append(genres);

const plot=root.querySelector("#runtime-boxplots"),distribution=stats.distribution;
if(!distribution)plot.append(el("p","stats-empty","아직 노래 시간 기록이 없습니다."));
else {
  const max=Math.max(3600,Math.ceil(distribution.max/3600)*3600),pct=n=>n/max*100+"%";
  const axis=el("div","runtime-axis");axis.append(el("span","num","0분"),el("span","num",songTimeLabel(max)));
  const summary=el("div","runtime-distribution"),viewport=el("div","runtime-points"),track=el("div","runtime-track"),whisker=el("i","runtime-whisker"),box=el("i","runtime-box"),median=el("i","runtime-median");
  viewport.setAttribute("role","group");viewport.setAttribute("aria-label","방송별 노래 시간");viewport.append(track);
  const boxLayer=el("div","runtime-box-layer");summary.append(boxLayer);
  whisker.style.left=pct(distribution.low);whisker.style.width=pct(distribution.high-distribution.low);
  box.style.left=pct(distribution.q1);box.style.width=pct(distribution.q3-distribution.q1);median.style.left=pct(distribution.median);boxLayer.append(whisker,box,median);
  [["하위 25%",distribution.q1],["중앙",distribution.median],["상위 25%",distribution.q3]].forEach(([label,value],index)=>{
    const guide=el("span","runtime-guide"),caption=el("span",null,label);
    guide.style.left=pct(value);guide.style.setProperty("--guide-row",index);guide.append(caption);
    if(value/max<.15)caption.style.transform="none";else if(value/max>.85)caption.style.transform="translateX(-100%)";
    guide.setAttribute("aria-label",label+" · "+songTimeLabel(value));boxLayer.append(guide);
  });
  const notice=el("output","runtime-selection");notice.setAttribute("aria-live","polite");
  const hint="점을 선택하면 해당 방송으로 이동합니다. 빈 원은 아웃라이어입니다.";notice.textContent=hint;
  const preview=el("div","runtime-preview"),image=el("img"),copy=el("div"),date=el("time","num"),title=el("b"),duration=el("span");
  preview.id="runtime-preview";preview.hidden=true;preview.setAttribute("role","tooltip");image.alt="";
  copy.append(date,title,duration);preview.append(image,copy);plot.append(preview);
  let previewTimer;
  const hidePreview=()=>{clearTimeout(previewTimer);preview.hidden=true;};
  const deferHide=()=>{previewTimer=setTimeout(hidePreview,120);};
  preview.addEventListener("mouseenter",()=>clearTimeout(previewTimer));preview.addEventListener("mouseleave",hidePreview);
  const dismiss=event=>{if(event.key==="Escape")hidePreview();};
  root.addEventListener("keydown",dismiss);viewport.addEventListener("scroll",hidePreview);
  window.addEventListener("scroll",hidePreview,true);
  disposePreview=()=>{hidePreview();root.removeEventListener("keydown",dismiss);window.removeEventListener("scroll",hidePreview,true);};
  const points=[];
  [...stats.sessions].sort((a,b)=>a.seconds-b.seconds||a.date.localeCompare(b.date)).forEach(session=>{
    const outside=session.seconds<distribution.lowFence||session.seconds>distribution.highFence;
    const point=el("a","runtime-dot"+(outside?" outlier":""));point.href=recentBroadcastUrl(session);point.style.left=pct(session.seconds);
    const description=session.date+" · "+(session.title||"방송")+" · 노래 "+songTimeLabel(session.seconds)+(outside?" · 아웃라이어":"");
    point.setAttribute("aria-label",description);point.setAttribute("aria-describedby",preview.id);
    for(const event of ["mouseenter","focus"])point.addEventListener(event,()=>{
      clearTimeout(previewTimer);notice.textContent=description;image.src=thumbnail(session);
      date.textContent=session.date;date.dateTime=session.date;title.textContent=session.title||session.date+" 방송";duration.textContent="노래 "+songTimeLabel(session.seconds);
      preview.hidden=false;
      const anchor=point.getBoundingClientRect(),rect=preview.getBoundingClientRect();
      preview.style.left=Math.max(8,Math.min(window.innerWidth-rect.width-8,anchor.left+anchor.width/2-rect.width/2))+"px";
      preview.style.top=Math.max(8,anchor.top>rect.height+16?anchor.top-rect.height-10:Math.min(window.innerHeight-rect.height-8,anchor.bottom+10))+"px";
    });
    point.addEventListener("mouseleave",()=>{notice.textContent=hint;deferHide();});
    point.addEventListener("blur",()=>{notice.textContent=hint;hidePreview();});
    track.append(point);points.push({point,seconds:session.seconds});
  });
  // 체크포인트처럼 박스 위에 세 줄로 포개어 같은 시간 축에서 읽는다.
  const layout=()=>{
    hidePreview();
    const ends=[-Infinity,-Infinity,-Infinity];
    points.forEach(({point,seconds},index)=>{
      const x=seconds/max*track.clientWidth;let lane=index%3;
      if(x-ends[lane]<16)lane=ends.findIndex(end=>x-end>=16);
      if(lane<0)lane=ends.length;
      ends[lane]=x;point.style.setProperty("--point-y",(22+lane*13)+"px");
    });
    const height=35+(ends.length-1)*13;
    track.style.height=height+"px";viewport.style.height=Math.min(196,height)+"px";
    summary.style.height=Math.max(132,70+Math.min(196,height))+"px";
    // 고밀도일 때만 생기는 스크롤바 폭까지 같은 척도로 맞춘다.
    boxLayer.style.width=axis.style.width=track.clientWidth+"px";
  };
  const marks=el("div","runtime-marks");
  for(const [label,value] of [["최저",distribution.min],["하위 25%",distribution.q1],["중앙값",distribution.median],["상위 25%",distribution.q3],["최고",distribution.max]]){
    const mark=el("span","runtime-mark");mark.append(el("small",null,label),el("b","num",songTimeLabel(value)));marks.append(mark);
  }
  summary.append(viewport);plot.append(axis,summary,marks,notice);observer=new ResizeObserver(layout);observer.observe(track);
}

const recordList=root.querySelector("#record-list"),streakList=root.querySelector("#streak-list");
root.querySelector("#streak-count").textContent=stats.streaks.length+"곡 · 3회 이상";
function paginate(list,pager,items,key,makeRow){
  const size=12,total=Math.max(1,Math.ceil(items.length/size)),requested=Number(query.get(key));
  let page=Math.min(total,Number.isSafeInteger(requested)&&requested>0?requested:1)-1;
  const previous=el("button",null,"←"),position=el("span","num"),next=el("button",null,"→");
  previous.type=next.type="button";previous.setAttribute("aria-label","이전 페이지");next.setAttribute("aria-label","다음 페이지");position.setAttribute("aria-live","polite");
  list.setAttribute("data-paged",String(total>1));pager.hidden=total===1;pager.append(previous,position,next);
  const update=()=>{pages[key]=page+1;list.replaceChildren(...items.slice(page*size,(page+1)*size).map((item,index)=>makeRow(item,page*size+index)));position.textContent=(page+1)+" / "+total;previous.disabled=page===0;next.disabled=page===total-1;if(initialized)syncNavigation(true);};
  previous.addEventListener("click",()=>{if(page>0){page--;update();}});
  next.addEventListener("click",()=>{if(page<total-1){page++;update();}});update();
}
paginate(recordList,root.querySelector("#record-pages"),stats.songs,"recordPage",(song,index)=>{
  const row=trackSong(el("a","record-row"),"record:"+song.song_id);row.href=songUrl(song.song_id);row.title=song.title+" · "+song.artist;
  const title=el("span","record-song",song.title);title.append(el("small",null,song.artist));
  row.append(el("span","record-rank num",String(index+1).padStart(2,"0")),title,el("b","record-count num",song.takes.length+"번"));return row;
});
const maxStreak=stats.streaks[0]?.best||1;
paginate(streakList,root.querySelector("#streak-pages"),stats.streaks,"streakPage",({id,meta,best,bestStart,bestEnd})=>{
  const entry=el("details","streak-entry"),row=el("summary","streak-row"),title=trackSong(el("a","streak-song",meta.title),"streak:"+id);title.href=songUrl(id);title.title=meta.title+" · "+meta.artist;
  row.title="연속 기록의 방송일 보기";
  const run=el("span","streak-run");run.style.width=best/maxStreak*100+"%";run.style.setProperty("--streak-count",best);run.style.setProperty("--streak-color",genreColor(meta.genre));
  run.setAttribute("aria-hidden","true");
  const dates=el("nav","streak-dates");dates.setAttribute("aria-label",meta.title+" 연속 기록의 방송일");
  for(const session of stats.sessions.slice(bestStart,bestEnd+1)){
    run.append(el("span","streak-point"));
    const link=el("a","streak-broadcast num",session.date);link.href=recentBroadcastUrl(session);link.setAttribute("aria-label",meta.title+" · "+session.date+" 방송");dates.append(link);
  }
  const date=session=>{const span=el("span","streak-date num",session.date.slice(5).replace("-","."));span.title=session.date;return span;};
  row.append(title,date(stats.sessions[bestStart]),run,date(stats.sessions[bestEnd]),el("b","streak-max num",best+"회"));entry.append(row,dates);return entry;
});
if(!stats.songs.length)recordList.append(el("p","stats-empty","아직 부른 기록이 없습니다."));
if(!stats.streaks.length)streakList.append(el("p","stats-empty","3회 이상 이어진 기록이 없습니다."));
initialized=true;syncNavigation();
if(query.get("statsFocus"))requestAnimationFrame(()=>{
  if(disposed)return;
  const target=[...songLinks].find(link=>link.dataset.statsFocus===query.get("statsFocus"));
  target?.focus({preventScroll:true});target?.scrollIntoView({block:"center",behavior:"instant"});
});

  return () => {disposed=true;observer?.disconnect();disposePreview();};
}
renderStatsPage(document.querySelector('.stats-page'),D,{el,genreColor,genreLabel,songTimeLabel,songUrl,recentBroadcastUrl,bookUrl});
</script>

</body>
