name: HLS 주소 갱신

# 치지직 다시보기 주소의 서명 토큰은 약 17시간 뒤 만료된다.
# 12시간마다 다시 받아 두면 한 번 걸러도 만료 전에 다음 기회가 온다.
#
# 페이지를 다시 굽지 않고 hls.json 하나만 바꾼다. 폰트도 썸네일도 건드리지 않으므로
# 러너에서 몇 초면 끝나고, 보는 사람은 갱신을 눈치채지 못한다.
# (수집·분석은 GPU와 원본 영상이 필요해 로컬에서만 돈다.)

on:
  push:
    branches: [main]
    paths:
      - "data/sessions.json"
  schedule:
    - cron: "0 1,13 * * *"      # UTC 01·13시 = 한국 10·22시
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-hls
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 표준 라이브러리만 쓴다 — 설치할 의존성이 없다.
      - name: 주소 갱신
        run: python scripts/refresh_hls.py --force --data data --out hls.json

      - name: 바뀐 것만 커밋
        run: |
          git config user.name  "rekatime-archive bot"
          git config user.email "actions@github.com"
          git add hls.json
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없습니다."
          else
            git commit -m "chore: HLS 주소 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
