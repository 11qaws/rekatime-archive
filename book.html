    --text: #E9EDF1;
    /* 작은 글자가 많은 화면이라 보조·희미 단계도 6.5:1 을 넘긴다.
       (surface-2 #1D2024 기준 dim 9.98 · faint 6.96 · mark 7.62)
       세 단계 구분은 밝기 차 대신 크기·굵기로 낸다. */
    --dim: #C3CBD4;
    --faint: #A1AAB5;
    /* 치지직의 상징색. 이 사이트가 치지직 다시보기를 다루므로 강조색을 그대로 쓴다. */
    --accent: #00FFA3;
    --mark: #19C98F;

    /* ── 유레카 개인색 ──────────────────────────────
       출처: premiere-aftereffect 의 AE 디자인 스터디에 personalYellow/personalGreen 으로
       명시된 값이다(방송 제목마다 붙는 🍋과도 맞는다).

       **쓰는 자리를 좁게 묶어 둔다.** 노랑(44.9도)은 장르색 KOREAN/한국어(39.4도)와
       5.5도밖에 안 떨어져 있어, 데이터 근처에 두면 장르로 읽힌다.
       그래서 장르·비율·달력처럼 색이 뜻을 갖는 자리에는 절대 쓰지 않고,
       **누구의 아카이브인가**를 말하는 자리에만 쓴다 — 이름표, 배경의 기운, 재생 단추. */
    --eureka-yellow: #F0CC61;
    --eureka-green:  #73C794;
    --eureka-deep:   #1F6B45;   /* 글자에는 못 쓴다(대비 2.97) — 채움 전용 */
    /* 색·사진 위에 얹는 글자 — 본문 토큰이 통하지 않는 자리의 예외다.
       (장르색 막대 위의 비율, 썸네일 위의 시간 배지) */
    --on-color: rgba(6, 7, 8, .78);
    --on-media: #fff;
    --scrim: rgba(6, 7, 8, .82);

    --radius-xs: 3px;
    --radius-s: 6px;
    --radius-m: 10px;
    --radius-pill: 999px;
    /* 폴백 순서를 명시한다. Pretendard와 SB 어그로에는 한자가 하나도 없고, 한국어 폰트도
       한자를 140~250자쯤 빠뜨린다. 한글 → 한자 → 가나·간체 → 기호 → 이모지 순으로 잇는다. */
    --font: "Pretendard", -apple-system, "Apple SD Gothic Neo",
            "Malgun Gothic", "Noto Sans CJK KR", "Yu Gothic", "Microsoft YaHei",
            "Segoe UI", system-ui, sans-serif,
            "Segoe UI Symbol", "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji";
    --font-display: "SB Aggro", "SB 어그로 M", var(--font);
  }

  * { box-sizing: border-box; }
  /* 버튼·입력은 글꼴을 물려받지 않아 Arial 로 떨어진다. 화살표·기호가 본문과 달라 보였다. */
  button, input, select, textarea { font-family: inherit; }

  body {
    margin: 0; color: var(--text);
    /* 맨 뒤에 유레카 색 기운을 아주 옅게 깐다. 왼쪽 위에서 노랑, 오른쪽 위에서 연두.
       뜻을 갖는 색이 아니라 "이 집의 공기"다 — 3% 라 글자 대비에 영향이 없다. */
    background:
      radial-gradient(760px 420px at 8% -6%, rgba(240, 204, 97, .055), transparent 70%),
      radial-gradient(680px 380px at 88% -10%, rgba(115, 199, 148, .045), transparent 70%),
      var(--bg);
    background-attachment: fixed;
    font-family: var(--font); font-size: 15.5px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-variant-numeric: tabular-nums; }
  main { max-width: 1180px; margin: 0 auto; padding: 36px 24px 36px; }

  /* ── 상단 바 ─────────────────────────────────────── */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: rgba(14, 15, 17, .94); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line-soft);
  }
  .topbar-inner {
    max-width: 1180px; margin: 0 auto; padding: 14px 24px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .brand {
    font-family: var(--font-display); font-weight: 500; font-size: 20px;
    letter-spacing: -.005em; margin: 0; white-space: nowrap;
  }
  .brand-sub { color: var(--faint); font-size: 13px; white-space: nowrap; }
  .search {
    flex: 1 1 240px; min-width: 180px; display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius-pill); padding: 8px 14px;
  }
  .search:focus-within { border-color: var(--mark); }
  .search input {
    flex: 1; background: none; border: 0; padding: 0; color: var(--text);
    font: inherit; font-size: 13px; outline: none; min-width: 0;
  }
  .search input::placeholder { color: var(--faint); }
  .search button {
    background: none; border: 0; color: var(--faint); font: inherit;
    cursor: pointer; padding: 0 4px; font-size: 15.5px;
  }
  .search button:hover { color: var(--text); }
  .topbar a.stats {
    font-size: 13px; color: var(--dim); text-decoration: none;
    border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 4px 14px; white-space: nowrap;
  }
  .topbar a.stats:hover { color: var(--text); border-color: var(--faint); }

  /* ── 공통 ────────────────────────────────────────── */
  section { margin-bottom: 36px; }
  .sec-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
  .sec-title {
    font-family: var(--font-display); font-weight: 500; font-size: 20px;
    letter-spacing: -.005em; margin: 0;
  }
  .sec-why { color: var(--faint); font-size: 13px; }
  .sec-act {
    margin-left: auto; background: none; border: 0; color: var(--mark);
    font: inherit; font-size: 13px; cursor: pointer; padding: 0;
    text-decoration: underline; text-underline-offset: 3px;
  }
  .sec-act:hover { color: var(--accent); }

  /* 초점 표시의 바닥값 — 요소마다 따로 적다 보면 반드시 빠뜨린다.
     실제로 검색창·상단 이동 링크·썸네일·미확인곡 링크가 표시 없이 남아 있었다.
     개별 규칙은 그대로 두고(모양을 다듬는 용도), 여기서 최소한을 보장한다. */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 제목은 홈으로 가는 길 — 글자 모양은 그대로 두고 동작만 준다 */
  .brand a { color: inherit; text-decoration: none; }
  .brand a:hover { color: var(--text); }

  /* ── 이동 ──────────────────────────────────────────
     PC 는 왼쪽 기둥, 모바일은 아래 띠. 둘은 같은 물건이 아니라 각자 만든다. */
  :root { --side-w: 216px; }

  .side {
    position: fixed; left: 0; top: 0; bottom: 0; width: var(--side-w); z-index: 20;
    display: flex; flex-direction: column; gap: 24px;
    padding: 24px 14px; background: var(--surface); border-right: 1px solid var(--line-soft);
    overflow-y: auto;
  }
  .side-brand { display: flex; flex-direction: column; gap: 4px; text-decoration: none; padding: 0 8px; }
  .side-brand-t {
    font-family: var(--font-display); font-weight: 500; font-size: 20px;
    color: var(--text); letter-spacing: -.005em;
    display: inline-flex; align-items: center; gap: 8px;
  }
  /* 유레카 표식 — 노랑에서 연두로. 데이터가 아니라 이름표라서 여기서만 쓴다. */
  .eu-mark {
    /* inline 요소에는 폭이 먹지 않는다 — 부모가 flex 인지에 기대지 않고 스스로 블록이 된다 */
    display: block; width: 10px; height: 10px; flex: none; border-radius: var(--radius-xs);
    background: linear-gradient(135deg, var(--eureka-yellow), var(--eureka-green));
    box-shadow: 0 0 0 1px rgba(240, 204, 97, .28);
  }
  .side-brand-s { font-size: 11.5px; color: var(--faint); }

  .side-list { display: flex; flex-direction: column; gap: 4px; }
  .side-item {
    display: flex; align-items: center; gap: 14px; padding: 8px 14px;
    border-radius: var(--radius-s); color: var(--dim); text-decoration: none; font-size: 13px;
    transition: background 120ms ease-out, color 120ms ease-out;
  }
  .side-item:hover { background: var(--surface-2); color: var(--text); }
  /* 지금 어디인지는 색이 아니라 왼쪽 표시로 — 강조색은 한 가지 뜻만 갖는다 */
  .side-item[aria-current="page"] {
    background: var(--surface-2); color: var(--text); font-weight: 600;
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .side-icon { width: 14px; text-align: center; color: var(--faint); font-size: 11.5px; }
  .side-item[aria-current="page"] .side-icon { color: var(--accent); }
  .side-foot { margin-top: auto; font-size: 11.5px; color: var(--faint); padding: 0 8px; }

  /* 본문을 기둥만큼 밀어낸다 */
  body.has-side main,
  body.has-side .wrap { margin-left: var(--side-w); }

  /* 모바일 전용 부분은 넓은 화면에서 존재하지 않는다 */
  .mtop, .mtabs { display: none; }
  .mtop-brand .eu-mark { width: 8px; height: 8px; }
  .mtabs-space { height: 0; }

  @media (max-width: 959px) {
    .side { display: none; }
    body.has-side main,
    body.has-side .wrap { margin-left: 0; }
    /* 아래 띠가 마지막 줄을 덮지 않도록 자리만 차지한다 */
    .mtabs-space { height: 56px; }

    /* 위에는 이름과 찾기만 — 이동은 아래 띠가 맡는다 */
    .mtop {
      position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px;
      padding: 8px 14px; background: var(--bg); border-bottom: 1px solid var(--line-soft);
    }
    .mtop-brand {
      font-family: var(--font-display); font-weight: 500; font-size: 15.5px;
      color: var(--text); text-decoration: none;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .mtop-find {
      margin-left: auto; background: none; border: 1px solid var(--line); color: var(--dim);
      width: 36px; height: 36px; border-radius: var(--radius-pill); font-size: 15.5px;
      cursor: pointer; padding: 0;
    }

    /* 엄지에 닿는 자리. 네 곳뿐이라 서랍에 접어 넣을 이유가 없다. */
    .mtabs {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--surface); border-top: 1px solid var(--line-soft);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .mtab {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 8px 4px; color: var(--faint); text-decoration: none; font-size: 11.5px;
    }
    .mtab-icon { font-size: 15.5px; line-height: 1; }
    /* 네 칸을 균등 분할하므로 글자가 접히면 띠 높이가 들쭉날쭉해진다 */
    .mtab-label { white-space: nowrap; }
    .mtab[aria-current="page"] { color: var(--accent); }

    /* 검색은 평소 감춰 두고 찾기를 누를 때만 위에 띄운다 */
    .side-search {
      position: fixed; left: 0; right: 0; top: 52px; z-index: 19;
      padding: 8px 14px; background: var(--bg); border-bottom: 1px solid var(--line-soft);
      display: none;
    }
    body.find-open .side-search { display: block; }
  }

  /* ── 곡 찾기 상자와 바로 가기 목록 ─────────────────── */
  .side-search { position: relative; }
  .find {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg); border: 1px solid var(--line);
    border-radius: var(--radius-s); padding: 8px 14px;
  }
  .find:focus-within { border-color: var(--mark); }
  .find i { color: var(--faint); font-size: 13px; font-style: normal; }
  .find input {
    flex: 1; min-width: 0; background: none; border: 0; padding: 0;
    color: var(--text); font: inherit; font-size: 13px; outline: none;
  }
  .find input::placeholder { color: var(--faint); }

  /* 목록이 아니라 '가는 길'이다 — 화면을 밀어내지 않고 위에 잠깐 뜬다 */
  .jump {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 30;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: var(--radius-s); overflow: hidden;
    box-shadow: 0 8px 24px rgba(6, 7, 8, .44);
  }
  .jump-row {
    display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 8px;
    align-items: baseline; padding: 8px 14px;
    color: var(--dim); text-decoration: none; font-size: 13px;
  }
  .jump-row i { width: 8px; height: 8px; border-radius: var(--radius-xs); display: block; }
  .jump-row[aria-selected="true"] { background: var(--surface); color: var(--text); }
  .jump-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .jump-t small { color: var(--faint); font-size: 11.5px; margin-left: 8px; }
  .jump-n { display: none; }
  .jump-none { padding: 14px; color: var(--faint); font-size: 13px; }
  .jump-more {
    display: block; padding: 8px 14px; font-size: 11.5px; color: var(--mark);
    text-decoration: none; border-top: 1px solid var(--line-soft);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .jump-more:hover { color: var(--accent); background: var(--surface); }

  @media (max-width: 959px) {
    /* 좁은 화면에서는 상자가 화면 폭을 쓰므로 회차 정보까지 보여줄 여유가 있다 */
    .jump-row { grid-template-columns: 8px minmax(0, 1fr) auto; }
    .jump-n { display: block; color: var(--faint); font-size: 11.5px; }
  }

  /* ── 칩 ────────────────────────────────────────────
     노래책의 보기·태그 거르개, 곡 상세의 태그가 모두 같은 물건이다.
     한 곳에 두지 않았더니 노래책에서는 스타일이 아예 안 붙어 브라우저 기본 버튼으로 나왔다. */
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 4px 14px; border-radius: var(--radius-pill);
    background: var(--surface); border: 1px solid var(--line);
    color: var(--dim); font: inherit; font-size: 13px; line-height: 1.4;
    cursor: pointer; white-space: nowrap;
    transition: background 120ms ease-out, border-color 120ms ease-out, color 120ms ease-out;
  }
  .chip:hover { background: var(--surface-2); color: var(--text); border-color: var(--faint); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 고른 상태는 테두리·글자로만 말한다. 강조색 채움을 쓰면 장르색과 뜻이 겹친다. */
  .chip[aria-pressed="true"] {
    background: var(--surface-2); color: var(--text);
    border-color: var(--accent); font-weight: 600;
  }

  /* 칩 안의 개수 — 12px 미만은 대비 6.5:1 을 맞추기 어려워 --dim 아래로 내리지 않는다. */
  .chip .n {
    font-family: var(--font-num, inherit); font-size: 11.5px;
    color: var(--dim); font-variant-numeric: tabular-nums;
  }
  .chip:hover .n, .chip[aria-pressed="true"] .n { color: var(--text); }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .filters { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }

  .empty {
    padding: 36px 14px; text-align: center; color: var(--dim); font-size: 13px;
    background: var(--surface); border-radius: var(--radius-m);
  }

  /* ── 노래책 ────────────────────────────────────── */
  .book-sum { font-size: 15.5px; color: var(--dim); margin: 0 0 14px; line-height: 1.7; }
  .book-sum b { color: var(--text); font-weight: 650; }

  /* 장르별 커버리지 — 어디가 많이 남았는지가 첫 정보다. 누르면 그 장르로 좁힌다. */
  .cov { display: flex; flex-direction: column; margin-bottom: 24px; }
  .cov-row {
    display: grid; grid-template-columns: 132px minmax(0, 1fr) 74px 78px; gap: 14px;
    align-items: center; width: 100%; padding: 8px 8px; border-radius: var(--radius-s);
    background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .cov-row:hover { background: var(--surface); }
  .cov-row[data-on="true"] { background: var(--surface-2); }
  .cov-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .cov-name { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
  .cov-name i { width: 9px; height: 9px; border-radius: var(--radius-xs); flex: none; }
  .cov-track { height: 8px; border-radius: var(--radius-pill); background: var(--surface-2); overflow: hidden; }
  .cov-fill { display: block; height: 100%; border-radius: var(--radius-pill); }
  .cov-n { font-size: 13px; color: var(--dim); text-align: right; }
  .cov-left { font-size: 11.5px; color: var(--faint); text-align: right; }

  /* 목록 — 안 부른 곡이 기본이라 대부분 조용한 행이다.
     부른 곡만 눌러서 무대로 갈 수 있으므로 그쪽에만 손가락 커서를 준다. */
  .book-list {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 0 24px;
  }
  .bk {
    display: grid; grid-template-columns: 3px minmax(0, 1fr) auto; gap: 14px;
    align-items: center; padding: 8px 8px; border-radius: var(--radius-s); text-align: left;
    background: none; border: 0; color: inherit; font: inherit;
    border-bottom: 1px solid var(--line-soft);
  }
  .bk-bar { width: 3px; height: 22px; border-radius: var(--radius-pill); opacity: .45; }
  .bk.sung { cursor: pointer; }
  .bk.sung .bk-bar { opacity: 1; }
  .bk.sung:hover { background: var(--surface); }
  .bk.sung:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .bk-t {
    font-size: 13px; color: var(--dim); overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .bk.sung .bk-t { color: var(--text); }
  .bk-t small { color: var(--faint); font-size: 13px; margin-left: 8px; }
  .bk-n { font-size: 11.5px; color: var(--mark); white-space: nowrap; }

  @media (max-width: 720px) {
    .cov-row { grid-template-columns: 100px minmax(0, 1fr) 62px; }
    .cov-left { display: none; }
  }

  /* 고른 가수 — 목록이 왜 짧아졌는지 화면에 남긴다 */
  .who {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 8px 14px; margin-top: 8px;
    background: var(--surface); border-radius: var(--radius-m);
  }
  .who-name { font-size: 15.5px; font-weight: 600; color: var(--text); }
  .who-n { font-size: 13px; color: var(--dim); }
  .who .chip { margin-left: auto; }


  .bk-link { color: inherit; text-decoration: none; }
  .bk-link:hover { text-decoration: underline; text-underline-offset: 3px; }
  /* 가수 이름은 목록을 그 가수로 좁힌다 — 페이지 이동이 아니라 제자리 거르기다 */
  .bk-a {
    background: none; border: 0; padding: 0; margin-left: 8px;
    font: inherit; font-size: 11.5px; color: var(--faint); cursor: pointer;
  }
  .bk-a:hover { color: var(--dim); text-decoration: underline; text-underline-offset: 2px; }

  /* ── 가수 목록 ──────────────────────────────────────
     막대 길이 = 노래책 보유 곡 수, 색 = 장르 구성, 진한 부분 = 이미 부른 만큼.

    /* 순서는 "얼마나 자주 가는가"다. 전체 조회는 한 곳뿐이므로 아래쪽에 둔다. */
    const ITEMS = [
      { id: "main",  label: "최근 방송", href: HOME,          icon: "▶" },
      { id: "month", label: "월간 정리", href: monthQ,       icon: "◴" },
      { id: "book",  label: "전체 곡",   href: "book.html",  icon: "≡" },
      { id: "stats", label: "통계",      label2: "기록",     href: "stats.html", icon: "◫" },
    ];

    /* ── PC: 왼쪽 기둥 ── */
    const side = mk("nav", "side");
    side.setAttribute("aria-label", "페이지 이동");

    const brand = mk("a", "side-brand");
    brand.href = HOME;
    /* 이름 옆의 작은 표식 하나. 유레카 개인색(노랑→연두)을 쓰는 자리는 여기처럼
       색이 데이터를 뜻하지 않는 곳뿐이다. 🍋 이 늘 붙는 방송 제목과 같은 결이다. */
    const name = mk("span", "side-brand-t");
    name.append(mk("i", "eu-mark"), document.createTextNode("유레카"));
    brand.append(name, mk("span", "side-brand-s", "노래 아카이브"));
    side.append(brand);

    const slot = mk("div", "side-search");
    slot.id = "nav-search";
    side.append(slot);

    const list = mk("div", "side-list");
    for (const it of ITEMS) {
      const a = mk("a", "side-item");
      a.href = it.href;
      if (it.id === here) a.setAttribute("aria-current", "page");
      a.append(mk("span", "side-icon", it.icon), mk("span", null, it.label));
      list.append(a);
    }
    side.append(list);

    const foot = mk("div", "side-foot");
    foot.id = "nav-foot";
    side.append(foot);

    /* ── 모바일: 위 이름띠 + 아래 이동띠 ── */
    const top = mk("div", "mtop");
    const mbrand = mk("a", "mtop-brand");
    mbrand.append(mk("i", "eu-mark"), document.createTextNode("유레카 노래 아카이브"));
    mbrand.href = HOME;
    const mfind = mk("button", "mtop-find");
    mfind.type = "button";
    mfind.setAttribute("aria-label", "곡 찾기");
    mfind.textContent = "⌕";
    top.append(mbrand, mfind);

    const tabs = mk("nav", "mtabs");
    tabs.setAttribute("aria-label", "페이지 이동");
    for (const it of ITEMS) {
      const a = mk("a", "mtab");
      a.href = it.href;
      if (it.id === here) a.setAttribute("aria-current", "page");
      a.append(mk("span", "mtab-icon", it.icon), mk("span", "mtab-label", it.label2 || it.label));
      tabs.append(a);
    }

    const spacer = mk("div", "mtabs-space");
    document.body.prepend(top, side);
    document.body.append(spacer, tabs);
    document.body.classList.add("has-side");

    /* 모바일의 찾기 단추는 검색 상자를 화면 위로 띄운다 */
    mfind.addEventListener("click", () => {
      document.body.classList.toggle("find-open");
      const input = document.getElementById("q");
      if (input && document.body.classList.contains("find-open")) input.focus();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") document.body.classList.remove("find-open");
    });
  })();

  /* ── 장르 비율 바 ────────────────────────────────
     색을 시간축에 흩뿌리면 방송마다 무늬가 달라 비교가 안 되고 눈만 어지럽다.
     대신 **순서를 고정한 가로 비율 바**로 바꾼다. 왼쪽부터 늘 같은 장르가 오므로
     방송을 세로로 쌓아 놓으면 비율 변화가 그대로 읽힌다.
       08-14 보카로 55%  ·  08-04 J-POP 46%  같은 성격 차이가 한 줄로 보인다. */

  const GENRE_ORDER = ["VOCALOID", "J-POP/애니", "ENGLISH/영어", "KOREAN/한국어", "OTHERS/기타"];

  function genreCounts(session) {
    const counts = new Map(GENRE_ORDER.map(g => [g, 0]));
    for (const b of session.blocks || []) {
      const key = GENRE_ORDER.includes(b.g) ? b.g : "OTHERS/기타";
      counts.set(key, counts.get(key) + 1);
    }
    return counts;
  }

  function mixBar(session, hooks = {}) {
    const compact = !!hooks.compact;
    const wrap = el("div", "mix-wrap" + (compact ? " compact" : ""));
    const bar = el("div", "mix");
    const counts = genreCounts(session);
    const total = (session.blocks || []).length || 1;
    const tip = compact ? null : el("div", "mix-tip");
    const cells = new Map();

    for (const genre of GENRE_ORDER) {
      const n = counts.get(genre);
      if (!n) continue;                      /* 없는 장르는 자리를 차지하지 않는다 */
      const share = n / total;
      const cell = compact ? el("div", "mix-seg") : el("button", "mix-seg");
      if (!compact) cell.type = "button";
      cell.style.flex = `${n} 0 0`;
      cell.style.background = genreColor(genre);
      cell.setAttribute("aria-label", `${genre} ${n}곡 ${Math.round(share * 100)}%`);
      /* 비율이 넉넉하면 바 안에 숫자를 직접 적는다. 좁으면 툴팁에 맡긴다. */
      if (!compact && share >= 0.16) {
        cell.append(el("b", null, `${Math.round(share * 100)}%`));
      }
      if (!compact) {
        const enter = () => {
          tip.replaceChildren(el("b", null, genre),
                              el("span", null, `${n}곡 · ${Math.round(share * 100)}%`));
          tip.setAttribute("data-show", "true");
          for (const [g, c] of cells) c.setAttribute("data-dim", String(g !== genre));
          if (hooks.onHover) hooks.onHover(genre);
        };
        const leave = () => {
          tip.setAttribute("data-show", "false");
          for (const [, c] of cells) c.removeAttribute("data-dim");
          if (hooks.onLeave) hooks.onLeave();
        };
        cell.addEventListener("mouseenter", enter);
        cell.addEventListener("focus", enter);
        cell.addEventListener("mouseleave", leave);
        cell.addEventListener("blur", leave);
      }
      cells.set(genre, cell);
      bar.append(cell);
    }

    if (tip) bar.append(tip);
    wrap.append(bar);

    if (!compact) {
      const sing = (session.blocks || []).reduce((sum, b) => sum + b.d, 0);
      const hours = (session.duration || 1) / 3600;
      const legend = el("div", "mix-legend");
      legend.append(el("b", null, `${total}곡`),
                    document.createTextNode(
                      `${hours.toFixed(1)}시간 방송 · 노래 ${(sing / 3600).toFixed(1)}시간 ` +
                      `(${Math.round(sing / (session.duration || 1) * 100)}%)`));
      wrap.append(legend);
    }
    return { el: wrap, cells };
  }

  /* ── 부르는 노래 ─────────────────────────────────
     이 화면이 답하는 것: "유레카는 무엇을 부르고, 무엇을 좋아하나".

     한동안 '아직 안 부른 곡'을 첫 정보로 뒀다가 뒤집었다.
     안 부른 곡에는 안 부른 이유가 있다 — 목록에 있다는 사실이 부를 뜻을 의미하지 않는다.
     반면 **여러 방송에 걸쳐 다시 부른 곡**은 이유가 분명하다. 좋아하니까 다시 부른다.
     그래서 첫 정보는 커버리지(얼마나 남았나)가 아니라 무엇을 얼마나 부르는가다.

     신호는 데이터가 준다: 부른 266곡 중 196곡은 한 방송뿐이고, 70곡만 다시 불렀다.
     그 70곡이 취향이다. 안 부른 곡 목록은 남겨 두되 기본에서 내린다. */

  const BOOK = D.book || [];
  const bookState = { axis: "song", group: "times", view: "sung",
                      genre: "전체", tag: "전체", artist: "", q: "" };
  /* 묶음을 그리는 동안 쓰는 값 — 순서(크기 결정)와 가장 큰 묶음(막대 기준) */
  let groupIndex = 0, groupMax = 1;

  /* 가수 목록은 곡 목록으로 들어가는 색인이다. 431명 각각에게 페이지를 주면
     대부분이 한 줄짜리 화면이 되지만, 한 화면에 모으면 취향이 보인다 —
     Neru 9곡, Mili 7곡, 요네즈 켄시 7곡. 한 가수의 곡을 여럿 부른다는 건 그 자체로 신호다.
     한 곡도 안 부른 가수는 목록에 넣지 않는다. 이 화면은 부른 것을 말하는 자리다. */
  function artistRows() {
    const by = new Map();
    for (const b of BOOK) {
      const a = (b.a || "").trim();
      if (!a) continue;
      if (!by.has(a)) by.set(a, { artist: a, total: 0, sung: 0, times: 0, genres: new Map() });
      const cell = by.get(a);
      cell.total += 1;
      if (b.n > 0) {
        cell.sung += 1;
        cell.times += b.n;                       /* 방송 수를 더한다 — 다시 부를수록 커진다 */
        const g = GENRE_ORDER.includes(b.g) ? b.g : "OTHERS/기타";
        cell.genres.set(g, (cell.genres.get(g) || 0) + 1);
      }
    }
    const q = bookState.q.trim().toLowerCase();
    return [...by.values()]
      .filter(r => r.sung > 0 && (!q || r.artist.toLowerCase().includes(q)))
      /* 부른 곡이 많은 순, 같으면 더 자주 부른 순 */
      .sort((a, b) => b.sung - a.sung || b.times - a.times);
  }

  function bookCounts() {
    const sung = BOOK.filter(b => b.n > 0).length;
    const again = BOOK.filter(b => b.n > 1).length;
    return { total: BOOK.length, sung, again, unsung: BOOK.length - sung };
  }

  function bookFiltered() {
    const q = bookState.q.trim().toLowerCase();
    return BOOK.filter(b => {
      if (bookState.view === "unsung" && b.n > 0) return false;
      if (bookState.view === "sung" && !b.n) return false;
      if (bookState.view === "again" && b.n < 2) return false;
      if (bookState.genre !== "전체" && (b.g || "OTHERS/기타") !== bookState.genre) return false;
      if (bookState.tag !== "전체" && !(b.k || []).includes(bookState.tag)) return false;
      if (bookState.artist && (b.a || "") !== bookState.artist) return false;
      if (q && !(`${b.t} ${b.a}`.toLowerCase().includes(q))) return false;
      return true;
    }).sort((a, b) => b.n - a.n || a.t.localeCompare(b.t, "ko"));
  }

  /* 첫 정보 — 무엇을 얼마나 부르나. 장르마다 부른 곡 수와, 그중 다시 부른 곡 수. */
  function bookCoverage(mount) {
    mount.replaceChildren();
    const byGenre = new Map(GENRE_ORDER.map(g => [g, { sung: 0, total: 0, again: 0 }]));
    for (const b of BOOK) {
      const key = GENRE_ORDER.includes(b.g) ? b.g : "OTHERS/기타";
      const cell = byGenre.get(key);
      cell.total += 1;
      if (b.n > 0) cell.sung += 1;
      if (b.n > 1) cell.again += 1;
    }
    const maxSung = Math.max(...[...byGenre.values()].map(c => c.sung), 1);
    for (const genre of GENRE_ORDER) {
      const { sung, total, again } = byGenre.get(genre);
      if (!sung) continue;
      const row = el("button", "cov-row");
      row.type = "button";
      row.setAttribute("aria-label", `${genre} ${sung}곡을 불렀고 그중 ${again}곡은 다시 불렀습니다`);
      row.addEventListener("click", () => {
        bookState.genre = bookState.genre === genre ? "전체" : genre;
        renderBook();
      });
      row.setAttribute("data-on", String(bookState.genre === genre));

      const name = el("span", "cov-name");
      const dot = el("i");
      dot.style.background = genreColor(genre);
      name.append(dot, document.createTextNode(genre));

      /* 길이 = 그 장르에서 부른 곡 수. 진한 부분 = 그중 다시 부른 곡.
         "많이 부르고, 다시도 부르는" 장르가 한눈에 길고 진하게 보인다. */
      const track = el("span", "cov-track");
      const fill = el("span", "cov-fill");
      fill.style.width = `${(sung / maxSung) * 100}%`;
      fill.style.background = genreColor(genre);
      const rep = el("span", "cov-again");
      rep.style.width = `${sung ? (again / sung) * 100 : 0}%`;
      fill.append(rep);
      track.append(fill);

      row.append(name, track,
                 el("span", "cov-n num", `${sung}곡`),
                 el("span", "cov-left num", again ? `다시 부른 ${again}곡` : "노래책 " + total + "곡 중"));
      mount.append(row);
    }
  }

  function renderBook() {
    const counts = bookCounts();
    document.getElementById("book-sum").innerHTML =
      `지금까지 <b>${counts.sung}곡</b>을 불렀고, 그중 <b>${counts.again}곡</b>은 여러 방송에서 다시 불렀습니다. ` +
      `<span class="sum-rest">노래책에 등록된 곡은 ${counts.total}곡입니다.</span>`;

    bookCoverage(document.getElementById("book-cov"));

    /* 고른 아티스트는 화면에 남겨 둔다 — 목록이 왜 짧아졌는지 보이지 않으면 길을 잃는다 */
    const who = document.getElementById("book-artist");
    who.replaceChildren();
    if (bookState.artist) {
      const all = BOOK.filter(b => (b.a || "") === bookState.artist);
      const sung = all.filter(b => b.n > 0).length;
      who.append(el("span", "who-name", bookState.artist));
      who.append(el("span", "who-n num", `노래책 ${all.length}곡 중 ${sung}곡 불렀습니다`));
      const off = el("button", "chip", "이 가수만 보기 해제");
      off.type = "button";
      off.addEventListener("click", () => { bookState.artist = ""; renderBook(); });
      who.append(off);
    }
    who.hidden = !bookState.artist;

    /* 축 전환 — 같은 질문("뭘 신청할까")을 곡으로 보느냐 가수로 보느냐 */
    const axes = document.getElementById("book-axis");
    axes.replaceChildren();
    for (const [value, label] of [["song", "곡으로 보기"], ["artist", "가수로 보기"]]) {
      const chip = el("button", "chip");
      chip.type = "button";
      chip.setAttribute("aria-pressed", String(bookState.axis === value));
      chip.textContent = label;
      chip.addEventListener("click", () => {
        bookState.axis = value;
        if (value === "artist") bookState.artist = "";
        renderBook();
      });
      axes.append(chip);
    }

    /* 가수 목록일 때는 곡 거르개를 숨긴다 — 지금 고르는 대상이 곡이 아니다 */
    const byArtist = bookState.axis === "artist";
    document.getElementById("book-filters").hidden = byArtist;
    document.getElementById("book-list").hidden = byArtist;
    document.getElementById("artist-list").hidden = !byArtist;
    if (byArtist) { renderArtists(); return; }

    /* 보기 전환 — 안 부른 곡이 기본이다 */
    const views = document.getElementById("book-views");
    views.replaceChildren();
    /* 부른 곡이 먼저다. 안 부른 곡은 남겨 두되 기본이 아니다. */
    for (const [value, label, n] of [["sung", "부른 곡", counts.sung],
                                     ["again", "다시 부른 곡", counts.again],
                                     ["all", "노래책 전체", counts.total],
                                     ["unsung", "아직 안 부른 곡", counts.unsung]]) {
      const chip = el("button", "chip");
      chip.type = "button";
      chip.setAttribute("aria-pressed", String(bookState.view === value));
      chip.append(document.createTextNode(label), el("span", "n", String(n)));
      chip.addEventListener("click", () => { bookState.view = value; renderBook(); });
      views.append(chip);
    }

    /* 묶는 축 — 거르기와 다른 일이다. 거르기는 목록을 줄이고, 묶기는 구조를 드러낸다. */
    const groupBox = document.getElementById("book-groups");
    groupBox.replaceChildren();
    for (const [value, label] of [["times", "부른 횟수로"], ["genre", "장르로"], ["artist", "가수로"]]) {
      const chip = el("button", "chip");
      chip.type = "button";
      chip.setAttribute("aria-pressed", String(bookState.group === value));
      chip.textContent = label;
      chip.addEventListener("click", () => { bookState.group = value; renderBook(); });
      groupBox.append(chip);
    }

    /* 태그는 지금 보고 있는 묶음 안에서만 센다 — 남은 곡의 태그가 곧 발견 거리다 */
    const pool = BOOK.filter(b => bookState.view === "all" ? true
                                : bookState.view === "again" ? b.n > 1
                                : bookState.view === "sung" ? b.n > 0 : !b.n);
    const tagCount = {};
    for (const b of pool) for (const k of (b.k || [])) tagCount[k] = (tagCount[k] || 0) + 1;
    const tags = document.getElementById("book-tags");
    tags.replaceChildren();
    const top = Object.entries(tagCount).sort((a, b) => b[1] - a[1]).slice(0, 10);
    for (const [tag, n] of [["전체", 0]].concat(top)) {
      const chip = el("button", "chip");
      chip.type = "button";
      chip.setAttribute("aria-pressed", String(bookState.tag === tag));
      chip.append(document.createTextNode(tag));
      if (n) chip.append(el("span", "n", String(n)));
      chip.addEventListener("click", () => {
        bookState.tag = bookState.tag === tag ? "전체" : tag;
        renderBook();
      });
      tags.append(chip);
    }

    const rows = bookFiltered();
    const list = document.getElementById("book-list");
    /* ── 묶어 보기 ──────────────────────────────────
       거르기만 해서는 목록이 짧아질 뿐 구조가 드러나지 않는다.
       부른 횟수 분포는 3 / 1 / 6 / 15 / 45 / 196 인데, 이 가파른 모양 자체가 이야기다 —
       몇 곡만 계속 돌아오고 대부분은 한 번뿐이다. 그래서 **묶음마다 항목 크기를 달리** 해
       위로 갈수록 크게, 아래로 갈수록 촘촘하게 둔다. 배치가 곧 정도다. */
    const groups = groupsOf(rows);
    groupIndex = 0;
    groupMax = Math.max(1, ...groups.map(g => g.items.length));
    list.replaceChildren(...groups.flatMap(g => renderGroup(g)));

    document.getElementById("book-count").textContent =
      rows.length > 400 ? `${rows.length}곡 중 400곡 표시` : `${rows.length}곡`;
    document.getElementById("book-empty").hidden = rows.length > 0;
  }

  /* 가수 목록 — 한 줄이 "이 가수 곡을 몇 곡, 몇 번 불렀나"다.
     막대 길이는 부른 곡 수(가장 많이 부른 가수가 100%), 색은 그 곡들의 장르 구성.
     길이 기준을 보유 곡 수로 두었더니 정렬 기준과 어긋나 막대가 칸 밖으로 나갔다 —
     정렬·길이·설명이 모두 같은 값을 가리켜야 한다. */
  function renderArtists() {
    const rows = artistRows();
    const mount = document.getElementById("artist-list");
    const max = Math.max(...rows.map(r => r.sung), 1);
    mount.replaceChildren(...rows.slice(0, 200).map(r => {
      const item = el("button", "ar");
      item.type = "button";
      item.title = `${r.artist} 곡만 보기`;
      item.addEventListener("click", () => {
        bookState.axis = "song";
        bookState.artist = r.artist;
        bookState.view = "sung";
        renderBook();
      });
      item.append(el("span", "ar-name", r.artist));

      const track = el("span", "ar-track");
      track.style.width = `${(r.sung / max) * 100}%`;
      for (const [g, n] of [...r.genres].sort(
             (a, b) => GENRE_ORDER.indexOf(a[0]) - GENRE_ORDER.indexOf(b[0]))) {
        const seg = el("i");
        seg.style.width = `${(n / r.sung) * 100}%`;
        seg.style.background = genreColor(g);
        track.append(seg);
      }

      item.append(track,
        el("span", "ar-n num", `${r.sung}곡 · ${r.times}번`),
        el("span", "ar-left num", `노래책 ${r.total}곡 중`));
      return item;
    }));
    document.getElementById("book-count").textContent = `${rows.length}명`;
    document.getElementById("book-empty").hidden = rows.length > 0;
  }

  /* 한 곡. tier 가 클수록 작고 촘촘해진다. */
  function songRow(b, tier) {
    const item = el("div", "bk bk-t" + tier + (b.n ? " sung" : ""));
    const bar = el("span", "bk-bar");
    bar.style.background = genreColor(GENRE_ORDER.includes(b.g) ? b.g : "OTHERS/기타");

    const title = el("span", "bk-t");
    if (b.n) {
      const to = el("a", "bk-link", b.t);
      to.href = songPageUrl(b.id);
      to.title = `${b.t} 기록 보기`;
      title.append(to);
    } else {
      title.append(document.createTextNode(b.t));
    }
    if (b.a && tier < 3 && bookState.group !== "artist") {
      const who = el("button", "bk-a");
      who.type = "button";
      who.textContent = b.a;
      who.title = `${b.a} 곡만 보기`;
      who.addEventListener("click", () => {
        bookState.artist = bookState.artist === b.a ? "" : b.a;
        renderBook();
      });
      title.append(who);
    }
    item.append(bar, title);
    if (tier < 3) item.append(el("span", "bk-n num", b.n ? `${b.n}개 방송` : ""));
    return item;
  }

  /* 고른 축으로 묶는다. 묶음은 [제목, 곡들, 색] 세 가지만 갖는다. */
  function groupsOf(rows) {
    if (bookState.group === "genre") {
      return GENRE_ORDER
        .map(g => ({ label: g, color: genreColor(g),
                     items: rows.filter(b => (GENRE_ORDER.includes(b.g) ? b.g : "OTHERS/기타") === g) }))
        .filter(x => x.items.length);
    }
    if (bookState.group === "artist") {
      const by = new Map();
      for (const b of rows) {
        const a = (b.a || "가수 미상").trim();
        if (!by.has(a)) by.set(a, []);
        by.get(a).push(b);
      }
      /* 1곡뿐인 가수가 137명이다. 묶음으로 늘어놓으면 제목만 137줄 늘어나고
         "묶었다"는 느낌이 사라진다 — 여러 곡을 부른 가수만 묶고 나머지는 한 묶음으로 모은다. */
      const many = [...by.entries()].filter(([, v]) => v.length > 1)
        .sort((x, y) => y[1].length - x[1].length || x[0].localeCompare(y[0], "ko"))
        .map(([a, items]) => ({ label: a, items }));
      const once = [...by.entries()].filter(([, v]) => v.length === 1)
        .sort((x, y) => x[0].localeCompare(y[0], "ko")).flatMap(([, v]) => v);
      if (once.length) many.push({ label: "한 곡씩 부른 가수", items: once,
                                   note: `${once.length}명` });
      return many;
    }
    /* 기본 — 부른 횟수. 많이 부른 쪽이 위로 온다. */
    const by = new Map();
    for (const b of rows) {
      const k = b.n || 0;
      if (!by.has(k)) by.set(k, []);
      by.get(k).push(b);
    }
    return [...by.entries()].sort((x, y) => y[0] - x[0]).map(([n, items]) => ({
      label: n === 0 ? "아직 안 부른 곡" : n === 1 ? "한 번 부른 곡" : `${n}개 방송에서`,
      items,
      note: n > 1 ? "다시 부른 곡" : "",
    }));
  }

  function renderGroup(g, i) {
    /* 묶음 순서가 곧 크기다. 위 두 묶음은 크게, 그다음은 보통, 나머지는 촘촘하게. */
    const idx = groupIndex++;
    const tier = bookState.group === "times" ? (idx === 0 ? 0 : idx === 1 ? 1 : idx < 4 ? 2 : 3)
                                             : (idx < 2 ? 1 : 2);
    const head = el("div", "bk-group");
    const name = el("span", "bk-group-t", g.label);
    if (g.color) {
      const dot = el("i", "bk-group-dot");
      dot.style.background = g.color;
      name.prepend(dot);
    }
    head.append(name, el("span", "bk-group-n num", `${g.items.length}곡`));
    if (g.note && g.note !== `${g.items.length}곡`)
      head.append(el("span", "bk-group-w", g.note));
    /* 묶음 크기를 막대로도 보여 준다 — 3 / 1 / 6 / 15 / 45 / 196 의 모양이 여기서 읽힌다 */
    const bar = el("span", "bk-group-bar");
    bar.style.width = `${Math.max(2, (g.items.length / groupMax) * 100)}%`;
    if (g.color) bar.style.background = g.color;
    head.append(bar);

    const box = el("div", "bk-items bk-tier" + tier);
    for (const b of g.items) box.append(songRow(b, tier));
    return [head, box];
  }

  /* ── 페이지 조립 ─────────────────────────────── */
  document.getElementById("nav-foot").textContent =
    `${D.meta.date_first} ~ ${D.meta.date_last} · 방송 ${D.meta.sessions}회`;

  /* 이 페이지에는 무대가 없다. 부른 곡의 기록은 아카이브에 있다.
     주소를 만들어 두고 진짜 링크로 건다 — 새 탭·뒤로 가기가 그대로 동작해야 한다. */
  function songPageUrl(id) {
    return "./?song=" + encodeURIComponent(id);
  }

  /* 통계·다른 페이지에서 "이 장르만" 하고 넘어오는 경우를 받는다 */
  const bq = new URLSearchParams(location.search);
  if (["unsung", "sung", "all"].includes(bq.get("view"))) bookState.view = bq.get("view");
  if (bq.get("genre")) bookState.genre = bq.get("genre");
  if (bq.get("tag")) bookState.tag = bq.get("tag");
  if (bq.get("artist")) bookState.artist = bq.get("artist");
  if (bq.get("by") === "artist") bookState.axis = "artist";
  /* 사이드바 찾기에서 "전체 곡에서 찾기"로 넘어온 경우 */
  if (bq.get("q")) { bookState.q = bq.get("q"); bookState.view = "all"; }

  const bookInput = document.getElementById("book-q");
  bookInput.value = bookState.q;
  bookInput.addEventListener("input", (e) => { bookState.q = e.target.value; renderBook(); });

  renderBook();
</script>

</body>
</html>
